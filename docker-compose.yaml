services:

  server:
    build:
      context: ./server

    image: myserver:v1

    container_name: myserver

    restart: unless-stopped

    networks:
      - mynetwork

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


  client:
    build:
      context: .

    image: myclient:v1

    container_name: myclient

    restart: unless-stopped

    networks:
      - mynetwork

    ports:
      - "8080:8080"

networks:
  mynetwork:
    driver: bridge