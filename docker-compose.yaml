services:

  server:
    build:
      context: ./server

    image: myserver:${IMAGE_TAG}

    container_name: myserver

    restart: unless-stopped

    networks:
      - mynetwork

    volumes:
      - /usr/share/python/myvolume:/myapp

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    command: ["python", "app.py"]


  client:
    build:
      context: .

    image: myclient:${IMAGE_TAG}

    container_name: myclient

    restart: unless-stopped

    networks:
      - mynetwork

    volumes:
      - /usr/share/nginx/html:/usr/share/nginx/html

    ports:
      - "8080:8080"

    depends_on:
      server:
        condition: service_healthy


networks:
  mynetwork:
    driver: bridge