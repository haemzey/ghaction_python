services:

  server:
    build:
      context: ./server

    image: myserver:v1

    container_name: myserver

    restart: unless-stopped

    networks:
      - mynetwork

    volumes:
      - myvolume:/myapp/data

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    command: ["python", "app.py"]


  client:
    build:
      context: .

    image: myclient:v1

    container_name: myclient

    restart: unless-stopped

    networks:
      - mynetwork

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    command: ["nginx", "-g", "daemon off;"]

    depends_on:
      server:
        condition: service_healthy

volumes:
  myvolume:
networks:
  mynetwork:
    driver: bridge