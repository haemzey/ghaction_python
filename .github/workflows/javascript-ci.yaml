name: Frontend CI (HTML/CSS/JS)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'client/**'
  push:
    branches: [main, dev]
    paths:
      - 'client/**'

env:
  NODE_VERSION: "20"

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run lint:html
      - run: npm run format:check

  frontend-test:
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-security:
    needs: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-docker-build:
    needs: frontend-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/myclient:${{ github.sha }} ./client
          docker push ${{ secrets.DOCKER_USERNAME }}/myclient:${{ github.sha }}

  frontend-docker-security:
    needs: frontend-docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/myclient:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  frontend-docker-test:
    needs: frontend-docker-security
    runs-on: ubuntu-latest
    steps:
      - run: docker network create mynetwork
      - run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/myclient:${{ github.sha }}
          docker run -d -p 8080:80 \
            --network mynetwork \
            --restart unless-stopped \
            --name myclient-${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/myclient:${{ github.sha }}
          sleep 5
      - run: curl -f http://localhost:8080/ || (echo "Smoke test failed" && exit 1)