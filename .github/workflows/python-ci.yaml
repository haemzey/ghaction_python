name: Server Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'server/**'
  push:
    branches:
      - main
      - dev
    paths:
      - 'server/**'

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
      - run: python -m pip install --no-cache-dir -r requirements.txt pytest flake8 black
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: check the flask app loads successfully
        run: python -c "from app import app; print('Flask app loaded successfully')"
      - run: pytest test_app.py
      - run: flake8 .
      - run: black --check .

  python-security:
    needs: python-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python -m pip install bandit
      - run: bandit -r . --exclude ./tests,./dist

  python-docker-build:
    needs: python-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: python build and push
        uses: docker/build-push-action@v4
        with:
          context: ./server
          no-cache: true
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}

  python-docker-security:
    needs: python-docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: pull docker image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
          format: "table"
          vuln-type: "os,library"
          scanners: vuln
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: '1'

  python-smoke-test:
    needs: python-docker-security
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: pull docker image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
      - name: run container
        run: |
          docker run -d -p 5000:5000 \
            --restart unless-stopped \
            --name myserver \
            ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
      - name: sleep time
        run: sleep 10
      - name: smoke test
        run: |
          curl -f http://localhost:5000/health || (echo "Smoke test failed" && exit 1)
          curl -f http://localhost:5000 || (echo "Smoke test failed" && exit 1)
      - name: Show container logs on failure
        if: failure()
        run: docker logs myserver
      - name: Stop backend container
        if: always()
        run: docker rm -f myserver