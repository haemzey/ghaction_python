name: Backend CI (Python/Flask)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'server/**'
  push:
    branches: [main, dev]
    paths:
      - 'server/**'

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install pylint
      - run: pylint $(git ls-files '*.py')

  python-build:
    needs: python-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --no-cache-dir -r requirements.txt build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: server/dist/

  python-test:
    needs: python-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --no-cache-dir -r requirements.txt pytest flake8 black
      - run: pytest --junitxml=results.xml
      - run: flake8 .
      - run: black --check .

  python-security:
    needs: python-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install bandit
      - run: bandit -r . --exclude ./tests,./dist

  python-docker-build:
    needs: python-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: |
          docker build -t myserver:${{ github.sha }} ./server 
          docker tag myserver:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}

  python-docker-security:
    needs: python-docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

  python-docker-test:
    needs: python-docker-security
    runs-on: ubuntu-latest
    steps:
      - run: docker network create mynetwork
      - run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
          docker run -d -p 8000:8000 \
            --network mynetwork \
            --volume myvolume:/myapp/data/library.db
            --restart unless-stopped \
            --name myserver-${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/myserver:${{ github.sha }}
          sleep 10
      - run: curl -f http://localhost:8000/health || (echo "Smoke test failed" && exit 1)